<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foto</title>

    <style>
        .img1{
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
        }

        .img2 {
            position: absolute;
        }

        .img3 {
            position: absolute;
            right: 0;
        }

        .img4 {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .img5 {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .img6 {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }

         .img7 {
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .img8 {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .img9 {
            position: absolute;
            bottom: 0;
            right: 0;
        }


        div {
            position: relative;
            background-color: rgb(78, 174, 78);
            height: 100vh;
            width: 100vw;
        }

        img{
            width: 400px;
            height: 280px;
        }
    </style>
</head>
<body>
   
   
    <div>

        <img class="img1" src="Imagenes/serpiente.jpg" alt="serpiente">
        <img class="img2" src="Imagenes/serpiente.jpg" alt="serpiente">
        <img class="img3" src="Imagenes/serpiente.jpg" alt="serpiente">
        <img class="img4" src="Imagenes/serpiente.jpg" alt="serpiente">
        <img class="img5" src="Imagenes/serpiente.jpg" alt="serpiente">
        <img class="img6" src="Imagenes/serpiente.jpg" alt="serpiente">
        <img class="img7" src="Imagenes/serpiente.jpg" alt="serpiente">
        <img class="img8" src="Imagenes/serpiente.jpg" alt="serpiente">
        <img class="img9" src="Imagenes/serpiente.jpg" alt="serpiente">

    </div>
    
    
</body>
</html>
